{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h3>Agregar producto al lote #{{ lote.id }}</h3>

  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>

      <div class="col-md-3">
        <label class="form-label">Cantidad</label>
        <input type="number" name="cantidad" min="1" class="form-control" required>
      </div>

      <div class="col-md-3">
        <label class="form-label">Precio de compra</label>
        <input type="number" step="0.01" name="precio_compra" class="form-control" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Costo envío unitario</label>
        <input type="number" step="0.01" name="costo_envio_unitario" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Costo extra</label>
        <input type="number" step="0.01" name="costo_extra" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Margen (%)</label>
        <input type="number" step="0.01" name="margen" value="0.5" class="form-control">
      </div>

      <div class="col-12">
        <label class="form-label">Categorías</label>
        <div class="form-check">
          {% for categoria in categorias %}
            <input class="form-check-input" type="checkbox" name="categorias" value="{{ categoria.id }}" id="cat{{ categoria.id }}">
            <label class="form-check-label" for="cat{{ categoria.id }}">{{ categoria.nombre }}</label><br>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-success">Guardar producto</button>
      <a href="{{ url_for('batches') }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
