{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h5>Editar lote</h5>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Costo envío</label>
        <input class="form-control" type="number" step="0.01" name="costo_envio" value="{{ lote.costo_envio }}" required>
      </div>
      <button class="btn btn-primary">Guardar cambios</button>
      <a href="{{ url_for('batches') }}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
