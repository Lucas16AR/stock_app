{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Categorías</h2>
    <a href="{{ url_for('category_new') }}" class="btn btn-primary mb-3">+ Nueva Categoría</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for categoria in categorias %}
            <tr>
                <td>{{ categoria.nombre }}</td>
                <td>
                    <a href="{{ url_for('category_edit', category_id=categoria.id) }}" class="btn btn-sm btn-warning">Editar</a>
                    <form action="{{ url_for('category_delete', category_id=categoria.id) }}" method="post" style="display:inline;" onsubmit="return confirm('¿Seguro que deseas eliminar esta categoría?');">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2">No hay categorías registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
